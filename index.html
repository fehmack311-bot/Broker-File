
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>دفتر التواصل</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#222;font-family:Arial,sans-serif;padding:14px}
button,input{font:inherit}
button{border:0;border-radius:7px;padding:9px 11px;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.app{max-width:650px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
h2{font-size:20px;margin:0}
.dark,.save{background:#222;color:#fff}
.cancel{background:#f1f1f1;color:#444}
.groups{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{background:#f6f6f6;color:#444}
.tab.active{background:#222;color:#fff}
.add-group{background:#eee;color:#333}
.group-title{display:flex;justify-content:space-between;align-items:center;margin:14px 0}
.group-title h3{font-size:16px;margin:0}
.group-delete{background:transparent;color:#999;font-size:12px}
.person{border-bottom:1px solid #eee;padding:12px 2px;margin-bottom:3px}
.line{display:flex;align-items:center;gap:6px}
.info{flex:1;min-width:0}
.name{font-weight:600;overflow-wrap:anywhere;font-size:14px}
.phone{font-size:12px;color:#888;margin-top:4px}
.star,.eye,.arrow,.del{background:transparent;color:#666;padding:0;width:29px;height:29px;min-width:29px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;border-radius:6px}
.star{font-size:19px;color:#aaa}
.star.on{color:#c99a00}
.del{font-size:19px;color:#888}
.arrow{font-size:18px}
.status{font-size:11px;padding:6px 7px;white-space:nowrap;border-radius:5px}
.none{background:#f7eeee;color:#9b4545}
.done{background:#edf5ef;color:#39754a}
.wait{background:#f5f2e9;color:#88743c}
.study{background:#f0f2f5;color:#526477}
.status-box{position:relative}
.status-list{display:none;position:absolute;background:#fff;border:1px solid #eee;border-radius:7px;z-index:5;left:0;top:33px;width:155px;box-shadow:0 4px 12px #00000012;overflow:hidden}
.status-list.show{display:block}
.status-list button{display:block;width:100%;text-align:right;background:#fff;font-size:12px;border-radius:0;padding:10px}
.status-list button:hover{background:#f6f6f6}
.children{margin:10px 0 0;padding-right:12px;border-right:1px solid #e8e8e8}
.child{display:flex;align-items:center;gap:5px;padding:9px 0;border-bottom:1px solid #f1f1f1}
.child .name{font-size:13px}
.child-add{font-size:12px;margin-top:8px;background:#f5f5f5;color:#444}
.add-person{width:100%;background:#f7f7f7;margin-top:12px;padding:12px 14px;color:#444;display:flex;align-items:center;justify-content:space-between;text-align:right}
.toggle-arrow{font-size:17px;color:#777}
.form{display:none;background:#fff;padding:12px;border:1px solid #eee;border-radius:8px;margin:10px 0}
.form.show{display:block}
.form input,.auth-card input,.modal input{width:100%;padding:11px;border:1px solid #e5e5e5;border-radius:7px;margin-bottom:8px;outline:none}
.actions{display:flex;gap:7px}
.actions button{flex:1}
.empty{text-align:center;color:#999;padding:25px 10px;background:#fafafa;border-radius:8px}

/* البحث */
.search-wrap{position:relative;margin:0 0 14px}
.search-row{display:flex;gap:7px}
.search-input{width:100%;min-width:0;padding:12px;border:1px solid #e8e8e8;border-radius:8px;outline:none;background:#fafafa}
.search-input:focus{border-color:#bbb;background:#fff}
.search-button{background:#222;color:#fff;min-width:62px}
.search-panel{display:none;position:absolute;top:calc(100% + 5px);right:0;left:0;background:#fff;border:1px solid #e8e8e8;border-radius:9px;box-shadow:0 6px 18px #00000012;z-index:15;max-height:280px;overflow:auto}
.search-panel.show{display:block}
.search-heading{font-size:11px;color:#999;padding:10px 12px 5px}
.search-item{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border-radius:0;background:#fff;text-align:right;border-bottom:1px solid #f2f2f2}
.search-item:last-child{border-bottom:0}
.search-item:hover{background:#f7f7f7}
.search-item .search-main{flex:1;min-width:0}
.search-item strong{display:block;font-size:13px;color:#333}
.search-item small{display:block;color:#999;font-size:11px;margin-top:4px}
.search-remove{background:transparent;color:#999;font-size:17px;padding:2px 7px}
.search-empty{font-size:12px;color:#999;padding:13px}

/* التحديد الداكن المؤقت */
.person.search-highlight{background:#222;color:#fff;border-radius:9px;padding:12px;margin:8px 0}
.person.search-highlight .name{color:#fff}
.person.search-highlight .phone{color:#ccc}
.person.search-highlight .star,.person.search-highlight .eye,.person.search-highlight .arrow,.person.search-highlight .del{color:#fff}
.person.search-highlight .children{border-right-color:#666}
.person.search-highlight .child{border-bottom-color:#555}

.modal-bg{display:none;position:fixed;inset:0;background:#0006;z-index:20;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:10px;padding:17px;width:100%;max-width:330px}
.modal h3{margin:0 0 12px;font-size:16px}
.modal p{font-size:14px;color:#666}
.modal-actions{display:flex;gap:8px;margin-top:12px}
.modal-actions button{flex:1}
#authScreen{max-width:390px;margin:10vh auto 0}
.auth-card{border:1px solid #eee;border-radius:12px;padding:22px}
.auth-card h2{margin-bottom:8px}
.muted{font-size:13px;color:#888;line-height:1.7;margin-bottom:18px}
.auth-card button{width:100%;margin-top:7px;padding:12px}
.auth-switch{background:#f5f5f5;color:#444}
#appScreen{display:none}
#userBar{font-size:12px;color:#888;display:flex;align-items:center;gap:8px}
#userBar button{font-size:11px;padding:6px 9px;background:#f3f3f3;color:#555}
.message{font-size:12px;color:#888;min-height:20px;margin:8px 0}
.message.error{color:#b44}
#busy{display:none;text-align:center;color:#888;padding:30px}
</style>
</head>
<body>

<div id="busy">جاري تحميل بياناتك...</div>

<section id="authScreen">
 <div class="auth-card">
  <h2>دفتر التواصل</h2>
  <p class="muted" id="authDescription">سجّل دخولك عشان تحفظ بياناتك وتوصل لها من أي جهاز.</p>
  <input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email">
  <input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password">
  <button class="dark" id="authButton" onclick="handleAuth()">تسجيل الدخول</button>
  <button class="auth-switch" id="switchButton" onclick="toggleAuthMode()">إنشاء حساب جديد</button>
  <div id="authMessage" class="message"></div>
 </div>
</section>

<section class="app" id="appScreen">
 <header>
  <h2>دفتر التواصل</h2>
  <div id="userBar">
   <span id="userEmail"></span>
   <button onclick="logout()">خروج</button>
  </div>
 </header>

 <div class="groups" id="groups"></div>

 <div class="group-title">
  <h3 id="groupTitle"></h3>
  <button class="group-delete" onclick="askDeleteGroup()">× حذف المجموعة</button>
 </div>

 <!-- خانة البحث -->
 <div class="search-wrap">
  <div class="search-row">
   <input class="search-input" id="searchInput" placeholder="ابحث عن اسم شخص..." autocomplete="off"
    onfocus="showSearchPanel()" oninput="renderSearchPanel()"
    onkeydown="if(event.key==='Enter'){event.preventDefault();submitSearch()}">
   <button class="search-button" onclick="submitSearch()">بحث</button>
  </div>
  <div class="search-panel" id="searchPanel"></div>
 </div>

 <div id="people"></div>

 <div class="form" id="personForm">
  <input id="personName" placeholder="اسم الشخص">
  <input id="personPhone" placeholder="رقم الجوال" type="tel">
  <div class="actions">
   <button class="save" onclick="savePerson()">إضافة</button>
   <button class="cancel" onclick="closePersonForm()">إلغاء</button>
  </div>
 </div>

 <button class="add-person" id="personToggle" onclick="togglePersonForm()">
  <span>＋ إضافة شخص</span>
  <span class="toggle-arrow" id="personToggleArrow">⌄</span>
 </button>
 <div id="appMessage" class="message"></div>
</section>

<div class="modal-bg" id="modalBg">
 <div class="modal" id="modalContent"></div>
</div>

<script>
const SUPABASE_URL="https://ayfxtomfqrantxmpqgof.supabase.co";
const SUPABASE_KEY="sb_publishable_2d8TzhMCRIuc6daKrObBGA_7i0jUIxe";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const LOCAL_KEY="simpleContactBookV2";

const parentStatuses=[
 {text:"✕ لم يتم التواصل",cls:"none"},
 {text:"✓ تم التواصل",cls:"done"},
 {text:"− لم يتم الرد",cls:"wait"}
];

const childStatuses=[
 {text:"دراسة الحالة",cls:"study"},
 {text:"في طور العملية",cls:"wait"},
 {text:"لم يتم الاتفاق",cls:"none"},
 {text:"تم التوقيع",cls:"done"}
];

let groups=[];
let active="";
let expanded={};
let revealed={};
let isSignup=false;
let currentUser=null;
let saveQueue=Promise.resolve();

/* متغيرات البحث */
let searchResults=[];
let searchFocused=false;
let highlightPersonId="";
let highlightTimer=null;

function uid(){return crypto.randomUUID()}
function newGroup(name){return{id:uid(),name,people:[]}}

function safe(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function showMessage(msg,error=false){
 const appVisible=document.getElementById("appScreen").style.display==="block";
 const el=document.getElementById(appVisible?"appMessage":"authMessage");
 el.textContent=msg;
 el.className="message"+(error?" error":"");
}

function toggleAuthMode(){
 isSignup=!isSignup;
 document.getElementById("authButton").textContent=isSignup?"إنشاء الحساب":"تسجيل الدخول";
 document.getElementById("switchButton").textContent=isSignup?"عندي حساب، تسجيل الدخول":"إنشاء حساب جديد";
 document.getElementById("authDescription").textContent=isSignup?
 "أنشئ حسابك بالإيميل وكلمة المرور.":"سجّل دخولك عشان تحفظ بياناتك وتوصل لها من أي جهاز.";
 document.getElementById("password").autocomplete=isSignup?"new-password":"current-password";
 showMessage("");
}

async function handleAuth(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;

 if(!email||!password){showMessage("اكتب الإيميل وكلمة المرور.",true);return}
 if(password.length<6){showMessage("كلمة المرور لازم تكون 6 أحرف على الأقل.",true);return}

 const btn=document.getElementById("authButton");
 btn.disabled=true;
 showMessage("جاري التحقق...");

 try{
  let result;
  if(isSignup){
   result=await db.auth.signUp({email,password});
  }else{
   result=await db.auth.signInWithPassword({email,password});
  }

  if(result.error)throw result.error;

  if(isSignup&&!result.data.session){
   showMessage("تم إنشاء الحساب. راجع بريدك الإلكتروني لتأكيد الحساب، ثم سجّل الدخول.");
   return;
  }

  if(result.data.session)await enterApp(result.data.session.user);
 }catch(e){
  showMessage(e.message||"صار خطأ أثناء تسجيل الدخول.",true);
 }finally{
  btn.disabled=false;
 }
}

async function logout(){
 await db.auth.signOut();
 currentUser=null;
 groups=[];
 active="";
 document.getElementById("appScreen").style.display="none";
 document.getElementById("authScreen").style.display="block";
 document.getElementById("password").value="";
 showMessage("تم تسجيل الخروج.");
}

function getLocalData(){
 try{
  const x=JSON.parse(localStorage.getItem(LOCAL_KEY));
  if(x&&Array.isArray(x.groups))return x;
 }catch(e){}
 return null;
}

function normalizeLocal(data){
 const idMap=new Map();
 const makeId=old=>{
  if(!idMap.has(old))idMap.set(old,uid());
  return idMap.get(old);
 };

 groups=(data.groups||[]).map(g=>({
  id:makeId(g.id||uid()),
  name:g.name||"مجموعة",
  people:(g.people||[]).map(p=>({
   id:makeId(p.id||uid()),
   name:p.name||"",
   phone:p.phone||"",
   status:Number(p.status)||0,
   favorite:!!p.favorite,
   children:(p.children||[]).map(c=>({
    id:makeId(c.id||uid()),
    name:c.name||"",
    phone:c.phone||"",
    status:Number(c.status)||0
   }))
  }))
 }));

 active=idMap.get(data.active)||groups[0]?.id||"";
}

async function enterApp(user){
 currentUser=user;
 document.getElementById("authScreen").style.display="none";
 document.getElementById("appScreen").style.display="block";
 document.getElementById("busy").style.display="block";
 document.getElementById("userEmail").textContent=user.email||"حسابي";

 try{
  await loadCloudData();
  document.getElementById("busy").style.display="none";
  render();
 }catch(e){
  document.getElementById("busy").style.display="none";
  showMessage("تعذر تحميل البيانات: "+e.message,true);
 }
}

async function loadCloudData(){
 const owner=currentUser.id;

 const [gRes,pRes,cRes]=await Promise.all([
  db.from("dc_groups").select("*").eq("owner_id",owner).order("created_at"),
  db.from("dc_people").select("*").eq("owner_id",owner),
  db.from("dc_children").select("*").eq("owner_id",owner)
 ]);

 if(gRes.error)throw gRes.error;
 if(pRes.error)throw pRes.error;
 if(cRes.error)throw cRes.error;

 if(!gRes.data.length){
  const local=getLocalData();

  if(local&&local.groups?.length){
   normalizeLocal(local);
   await saveCloudNow();
   return;
  }

  groups=[newGroup("المجموعة الأولى")];
  active=groups[0].id;
  await saveCloudNow();
  return;
 }

 const people=pRes.data;
 const children=cRes.data;

 groups=gRes.data.map(g=>({
  id:g.id,
  name:g.name,
  people:people.filter(p=>p.group_id===g.id).map(p=>({
   id:p.id,
   name:p.name,
   phone:p.phone,
   status:p.status,
   favorite:p.favorite,
   children:children.filter(c=>c.person_id===p.id).map(c=>({
    id:c.id,
    name:c.name,
    phone:c.phone,
    status:c.status
   }))
  }))
 }));

 active=groups[0]?.id||"";
}

function snapshot(){
 return JSON.parse(JSON.stringify({groups,active}));
}

function persist(){
 if(!currentUser)return;

 const data=snapshot();

 saveQueue=saveQueue.then(()=>saveSnapshot(data)).catch(e=>{
  console.error(e);
  showMessage("ما قدرنا نحفظ آخر تعديل: "+e.message,true);
 });
}

async function saveCloudNow(){
 await saveSnapshot(snapshot());
}

async function saveSnapshot(data){
 const owner=currentUser.id;
 const gs=data.groups;
 const ps=gs.flatMap(g=>g.people.map(p=>({...p,group_id:g.id})));
 const cs=ps.flatMap(p=>p.children.map(c=>({...c,person_id:p.id})));

 const groupRows=gs.map(g=>({
  id:g.id,owner_id:owner,name:g.name
 }));

 const peopleRows=ps.map(p=>({
  id:p.id,owner_id:owner,group_id:p.group_id,
  name:p.name,phone:p.phone,status:p.status,
  favorite:!!p.favorite
 }));

 const childRows=cs.map(c=>({
  id:c.id,owner_id:owner,person_id:c.person_id,
  name:c.name,phone:c.phone,status:c.status
 }));

 if(groupRows.length){
  const r=await db.from("dc_groups").upsert(groupRows);
  if(r.error)throw r.error;
 }

 if(peopleRows.length){
  const r=await db.from("dc_people").upsert(peopleRows);
  if(r.error)throw r.error;
 }

 if(childRows.length){
  const r=await db.from("dc_children").upsert(childRows);
  if(r.error)throw r.error;
 }

 await removeMissing("dc_children",childRows.map(x=>x.id),owner);
 await removeMissing("dc_people",peopleRows.map(x=>x.id),owner);
 await removeMissing("dc_groups",groupRows.map(x=>x.id),owner);

 localStorage.setItem(LOCAL_KEY,JSON.stringify(data));
 showMessage("تم الحفظ والمزامنة ✓");
}

async function removeMissing(table,ids,owner){
 let q=db.from(table).delete().eq("owner_id",owner);
 if(ids.length)q=q.not("id","in","("+ids.join(",")+")");
 const r=await q;
 if(r.error)throw r.error;
}

function current(){
 return groups.find(g=>g.id===active)||groups[0];
}

function render(){
 if(!groups.length)groups=[newGroup("المجموعة الأولى")];
 if(!groups.some(g=>g.id===active))active=groups[0].id;

 // زر إضافة المجموعة ظاهر دائماً بجانب المجموعات
 document.getElementById("groups").innerHTML=
  groups.map(g=>
   `<button class="tab ${g.id===active?"active":""}" onclick="selectGroup('${g.id}')">${safe(g.name)}</button>`
  ).join("")+
  `<button class="tab add-group" onclick="openGroupForm()">＋ إضافة مجموعة</button>`;

 document.getElementById("groupTitle").textContent=current().name;

 const list=[...current().people].sort((a,b)=>
  Number(!!b.favorite)-Number(!!a.favorite)
 );

 const area=document.getElementById("people");

 if(!list.length){
  area.innerHTML='<div class="empty">ما فيه أشخاص هنا</div>';
  renderSearchPanel();
  return;
 }

 area.innerHTML=list.map(p=>`
 <div class="person ${highlightPersonId===p.id?"search-highlight":""}" id="person-${p.id}">
  <div class="line">
   <button class="star ${p.favorite?"on":""}" onclick="favorite('${p.id}')">★</button>
   <div class="info">
    <div class="name">${privateText(p.id,p.name)}</div>
    <div class="phone">${privateText(p.id,p.phone)}</div>
   </div>
   ${statusButton(p.id,p.status,false)}
   <button class="arrow" onclick="toggleChildren('${p.id}')">⌄</button>
   ${eyeButton(p.id)}
   <button class="del" onclick="askDeletePerson('${p.id}')">×</button>
  </div>

  ${expanded[p.id]?`
  <div class="children">
   ${p.children.map(c=>`
    <div class="child">
     <div class="info">
      <div class="name">${privateText(c.id,c.name)}</div>
      <div class="phone">${privateText(c.id,c.phone)}</div>
     </div>
     ${statusButton(c.id,c.status,true)}
     ${eyeButton(c.id)}
     <button class="del" onclick="askDeleteChild('${c.id}')">×</button>
    </div>
   `).join("")}

   <button class="child-add" onclick="openChildForm('${p.id}')">＋ إضافة اسم</button>

   <div class="form" id="childForm-${p.id}">
    <input id="childName-${p.id}" placeholder="اسم الشخص">
    <input id="childPhone-${p.id}" placeholder="رقم الجوال" type="tel">
    <div class="actions">
     <button class="save" onclick="saveChild('${p.id}')">إضافة</button>
     <button class="cancel" onclick="closeChildForm('${p.id}')">إلغاء</button>
    </div>
   </div>
  </div>`:""}
 </div>
 `).join("");
 renderSearchPanel();
}

/* سجل البحث محفوظ على نفس الجهاز ولكل حساب سجل مستقل */
function searchHistoryKey(){
 return "dcSearchHistory:"+((currentUser&&currentUser.id)||"guest");
}

function getSearchHistory(){
 try{
  const value=JSON.parse(localStorage.getItem(searchHistoryKey())||"[]");
  return Array.isArray(value)?value.filter(x=>typeof x==="string"):[];
 }catch(e){return []}
}

function saveSearchHistory(items){
 localStorage.setItem(searchHistoryKey(),JSON.stringify(items));
}

function showSearchPanel(){
 searchFocused=true;
 renderSearchPanel();
}

function renderSearchPanel(){
 const panel=document.getElementById("searchPanel");
 const input=document.getElementById("searchInput");
 if(!panel||!input)return;
 const query=input.value.trim().toLowerCase();

 if(!searchFocused){
  panel.classList.remove("show");
  return;
 }

 if(query){
  searchResults=[];
  groups.forEach(g=>g.people.forEach(p=>{
   const parentMatch=String(p.name||"").toLowerCase().includes(query);
   const childMatch=p.children.find(c=>String(c.name||"").toLowerCase().includes(query));
   if(parentMatch||childMatch){
    searchResults.push({
     groupId:g.id,personId:p.id,
     personName:p.name,
     childName:parentMatch?"":childMatch.name,
     groupName:g.name
    });
   }
  }));

  if(!searchResults.length){
   panel.innerHTML='<div class="search-empty">ما لقينا اسم يطابق بحثك</div>';
  }else{
   panel.innerHTML='<div class="search-heading">نتائج البحث</div>'+
    searchResults.map((r,i)=>`
     <button class="search-item" onclick="openSearchResult(${i})">
      <span class="search-main">
       <strong>${safe(r.personName)}</strong>
       <small>${safe(r.groupName)}${r.childName?" · الاسم الفرعي: "+safe(r.childName):""}</small>
      </span>
      <span>↗</span>
     </button>
    `).join("");
  }
 }else{
  const history=getSearchHistory();
  searchResults=[];
  panel.innerHTML=history.length?
   '<div class="search-heading">عمليات البحث السابقة</div>'+
   history.map((item,i)=>`
    <div class="search-item">
     <button class="search-main" style="background:transparent;text-align:right;padding:0" onclick="useSearchHistory(${i})">
      <strong>${safe(item)}</strong>
      <small>بحث سابق</small>
     </button>
     <button class="search-remove" title="حذف البحث" aria-label="حذف البحث" onclick="removeSearchHistory(${i})">×</button>
    </div>
   `).join("")
   :'<div class="search-empty">ما فيه عمليات بحث سابقة</div>';
 }
 panel.classList.add("show");
}

function addSearchHistory(query){
 query=String(query||"").trim();
 if(!query)return;
 let items=getSearchHistory().filter(x=>x.toLowerCase()!==query.toLowerCase());
 items.unshift(query);
 saveSearchHistory(items.slice(0,12));
}

function removeSearchHistory(index){
 const items=getSearchHistory();
 items.splice(index,1);
 saveSearchHistory(items);
 // الحذف فوري بدون رسالة تأكيد
 renderSearchPanel();
}

function useSearchHistory(index){
 const item=getSearchHistory()[index];
 if(!item)return;
 document.getElementById("searchInput").value=item;
 renderSearchPanel();
 submitSearch();
}

function submitSearch(){
 const input=document.getElementById("searchInput");
 const query=input.value.trim();
 if(!query)return;
 addSearchHistory(query);
 renderSearchPanel();
 if(searchResults.length===1)openSearchResult(0);
}

function openSearchResult(index){
 const result=searchResults[index];
 if(!result)return;

 addSearchHistory(document.getElementById("searchInput").value.trim());
 active=result.groupId;
 expanded[result.personId]=true;
 highlightPersonId=result.personId;

 if(highlightTimer)clearTimeout(highlightTimer);

 searchFocused=false;
 render();

 requestAnimationFrame(()=>{
  const target=document.getElementById("person-"+result.personId);
  if(target)target.scrollIntoView({behavior:"smooth",block:"center"});
 });

 highlightTimer=setTimeout(()=>{
  highlightPersonId="";
  render();
 },3000);
}

document.addEventListener("click",function(event){
 const wrap=document.querySelector(".search-wrap");
 if(wrap&&!wrap.contains(event.target)){
  searchFocused=false;
  document.getElementById("searchPanel")?.classList.remove("show");
 }
});

function privateText(id,value){
 return revealed[id]===false?"****":safe(value);
}

function eyeButton(id){
 return `<button class="eye" onclick="toggleEye('${id}')">👁</button>`;
}

function toggleEye(id){
 revealed[id]=revealed[id]===false;
 render();
}

function statusButton(id,value,isChild=false){
 const data=isChild?childStatuses:parentStatuses;
 const s=data[value]||data[0];

 return `<div class="status-box">
  <button class="status ${s.cls}" onclick="toggleStatus('${id}')">${s.text}</button>
  <div class="status-list" id="status-${id}">
   ${data.map((x,i)=>
    `<button onclick="setStatus('${id}',${i},${isChild})">${x.text}</button>`
   ).join("")}
  </div>
 </div>`;
}

function selectGroup(id){
 active=id;
 render();
}

function favorite(id){
 const p=current().people.find(x=>x.id===id);
 if(p){
  p.favorite=!p.favorite;
  render();
  persist();
 }
}

function toggleChildren(id){
 expanded[id]=!expanded[id];
 render();
}

function toggleStatus(id){
 const menu=document.getElementById("status-"+id);
 if(!menu)return;

 document.querySelectorAll(".status-list").forEach(x=>{
  if(x!==menu)x.classList.remove("show");
 });

 menu.classList.toggle("show");
}

function setStatus(id,value,isChild){
 for(const g of groups)for(const p of g.people){
  if(!isChild&&p.id===id){
   p.status=value;
   render();
   persist();
   return;
  }

  if(isChild){
   const c=p.children.find(x=>x.id===id);
   if(c){
    c.status=value;
    render();
    persist();
    return;
   }
  }
 }
}

// إضافة مجموعة
function openGroupForm(){
 showModal(`
  <h3>إضافة مجموعة</h3>
  <input id="newGroupName" placeholder="اسم المجموعة">
  <div class="modal-actions">
   <button class="save" onclick="saveGroup()">إضافة</button>
   <button class="cancel" onclick="closeModal()">إلغاء</button>
  </div>
 `);

 document.getElementById("newGroupName").focus();
}

function saveGroup(){
 const input=document.getElementById("newGroupName");
 const name=input.value.trim();

 if(!name){
  input.focus();
  return;
 }

 const group=newGroup(name);
 groups.push(group);
 active=group.id;

 closeModal();
 render();
 persist();
}

function askDeleteGroup(){
 if(groups.length===1){
  showModal('<h3>تنبيه</h3><p>لازم تخلي مجموعة واحدة على الأقل.</p><button class="dark" onclick="closeModal()">حسنًا</button>');
  return;
 }

 askConfirm("تبي تحذف المجموعة وكل الأسماء الموجودة فيها؟","confirmDeleteGroup()");
}

function confirmDeleteGroup(){
 groups=groups.filter(g=>g.id!==active);
 active=groups[0].id;
 closeModal();
 render();
 persist();
}

function openPersonForm(){
 document.getElementById("personForm").classList.add("show");
 document.getElementById("personToggleArrow").textContent="⌃";
 document.getElementById("personName").focus();
}

function togglePersonForm(){
 const f=document.getElementById("personForm");
 if(f.classList.contains("show"))closePersonForm();
 else openPersonForm();
}

function closePersonForm(){
 document.getElementById("personForm").classList.remove("show");
 document.getElementById("personToggleArrow").textContent="⌄";
 document.getElementById("personName").value="";
 document.getElementById("personPhone").value="";
}

function savePerson(){
 const name=document.getElementById("personName").value.trim();
 const phone=document.getElementById("personPhone").value.trim();

 if(!name||!phone){
  alert("اكتب الاسم ورقم الجوال");
  return;
 }

 current().people.push({
  id:uid(),name,phone,status:0,favorite:false,children:[]
 });

 closePersonForm();
 render();
 persist();
}

function saveChild(id){

function showModal(html){
 document.getElementById("modalContent").innerHTML=html;
 document.getElementById("modalBg").classList.add("show");
}

function closeModal(){

}

function askConfirm(message,action){

   <button class="save" onclick="${action}">نعم، احذف</button>
   <button class="cancel" onclick="closeModal()">إلغاء</button>
  </div>
 `);
}
